[project]
name = "oil-train-safe-backend"
version = "0.1.0"
description = "油训智安 — 油气储运工程岗位智能实训与安全能力评测系统 (后端)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "openai>=1.30",
  "qdrant-client>=1.9",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "loguru>=0.7",
]

[project.optional-dependencies]
local-models = [
  "sentence-transformers>=2.7",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "anyio>=4.3",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
  "integration: marks integration tests (deselect with '-m \"not integration\"')",
  "requires_llm: marks tests requiring real Bailian API key",
  "requires_qdrant: marks tests requiring Qdrant running",
  "requires_db: marks tests requiring PostgreSQL running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
