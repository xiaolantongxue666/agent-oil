# 油训智安 Nginx 反向代理 —— 本机开发专用（纯 HTTP，无证书）
# 服务器线上配置见 nginx.conf（443 + LetEncrypt，由 docker-compose.server.yml 挂载证书）
upstream ots_backend {
  server backend:8000;
}

upstream ots_frontend {
  server frontend:80;
}

server {
  listen 80;

  client_max_body_size 20m;

  # 前端静态资源
  location / {
    proxy_pass http://ots_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 后端 API
  location /api/ {
    proxy_pass http://ots_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_buffering off;  # 支持 SSE/流式
    proxy_cache off;
    gzip off;
  }
}
